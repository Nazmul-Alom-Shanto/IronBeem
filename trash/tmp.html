<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Stream</title>
  <style>
    body { margin:0; background:black; display:flex; align-items:center; justify-content:center; height:100vh; }
    canvas { border:2px solid lime; border-radius:8px; }
  </style>
</head>
<body>
  <canvas id="videoCanvas"></canvas>

  <script>
    const ws = new WebSocket("http://192.168.0.104/stream");
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");
    const img = new Image();

    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
    };

    ws.onmessage = (event) => {
      const blob = event.data;
      const url = URL.createObjectURL(blob);
      img.src = url;
    };
  </script>
</body>
</html>
